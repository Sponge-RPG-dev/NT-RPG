plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '8.3.8'
    id "xyz.jpenilla.run-paper" version "2.3.1"
}

repositories {
    mavenCentral()
    maven {
        url "https://repo.papermc.io/repository/maven-public/"
        content {
            includeGroupByRegex "(net\\.Indyuce|io\\.lumine)"
        }
    }
    maven {
        url "https://hub.spigotmc.org/nexus/content/repositories/snapshots"
    }
    maven {
        url "https://mvn.lumine.io/repository/maven-public/"
    }
    maven {
        url "https://oss.sonatype.org/content/repositories/snapshots"
    }
    maven {
        url "https://repo.codemc.org/repository/maven-public/"
    }
    maven {
        url = "https://repo.extendedclip.com/content/repositories"
    }
    maven {
        url "https://repo.dmulloy2.net/repository/public/"
    }

    maven {
        url = "https://repo.citizensnpcs.co"
    }

    maven {
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
        content {
            includeGroupByRegex "(me\\.clip)"
        }
    }
    maven {
        url = "https://nexus.phoenixdevt.fr/repository/maven-public/"
    }
    maven {
        url = "https://repo.bg-software.com/repository/dependencies/"
    }
    maven {
        url = "https://maven.devs.beer/"
    }
    maven {
        url = "https://libraries.minecraft.net/"
    }
}

group = 'cz.neumimto.rpg'
version = project.p_spigot_version

dependencies {
    implementation fileTree(dir: 'lib-cp', include: '*.jar')
    compileOnly fileTree(dir: 'lib', include: '*.jar')

    annotationProcessor project(':Generator')

    compileOnly("io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT")

    api project(':Common')
    api project(':FlatFiles-Persistence')


    compileOnly 'com.denizenscript:denizen:1.3.1-SNAPSHOT'
    compileOnly 'com.denizenscript:denizencore:1.91.0-SNAPSHOT'
    compileOnly("org.spigotmc:plugin-annotations:1.2.3-SNAPSHOT") {
        exclude group: "org.bukkit", module: "bukkit"
    }

    compileOnly("com.comphenix.protocol:ProtocolLib:5.4.0-SNAPSHOT") {
        exclude group: "com.comphenix.executors", module: "BukkitExecutors"
    }

    api 'com.elmakers.mine.bukkit:EffectLib:10.10'
    api 'com.github.stefvanschie.inventoryframework:IF:0.11.2'
    api 'net.kyori:adventure-platform-bukkit:4.3.0'
    api "co.aikar:acf-paper:0.5.1-SNAPSHOT"
    compileOnly 'com.github.placeholderapi:placeholderapi:2.11.6'
    compileOnly("io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT")
    compileOnly("ru.endlesscode.mimic:mimic-bukkit-api:0.8.0")


    compileOnly('net.Indyuce:MMOItems-API:6.9.5-SNAPSHOT') {
        exclude group: 'com.mojang', module: 'authlib'
        exclude group: 'org.jetbrains', module: 'annotations'
    }
    compileOnly('io.lumine:MythicLib-dist:1.6.2-SNAPSHOT')

    compileOnly 'io.lumine:Mythic:5.1.0-SNAPSHOT'
    implementation 'com.mojang:brigadier:1.0.500'
    //compileOnly 'io.lumine:Mythic-API:' + project.mythicmobs
    compileOnly 'io.lumine:Mythic-Plugin:5.2.3'
    compileOnly 'io.lumine:Mythic-Dist:5.2.3'
    compileOnly 'io.lumine:LumineUtils:1.19-SNAPSHOT'
    compileOnly 'com.gitlab.SamB440:RPGRegions-2:9e46ca8d'

    compileOnly 'net.luckperms:api:5.5'
    compileOnly 'io.th0rgal:Oraxen:1.187.0'
    compileOnly 'net.kyori:adventure-platform-bukkit:4.4.1'
    compileOnly 'dev.lone:api-itemsadder:4.0.10'
    //compileOnly 'javax.inject:javax.inject:1'

    testImplementation 'com.github.MockBukkit:MockBukkit:v1.21-SNAPSHOT'
    testImplementation "co.aikar:acf-paper:0.5.1-SNAPSHOT"
    testImplementation 'me.devnatan:inventory-framework-api:3.5.0'
    testImplementation 'commons-lang:commons-lang:2.6'
}

shadowJar {

    relocate 'co.aikar.commands', 'rpgshaded.acf'
    relocate 'co.aikar.locales', 'rpgshaded.locales'
    relocate 'com.github.stefvanschie', 'rpgshaded.com.github.stefvanschie'
    relocate 'de.slikey', 'rpgshaded.de.slikey'

    mergeServiceFiles()
}

build.dependsOn shadowJar

build.mustRunAfter tasks.getByPath(':Common:build')
build.mustRunAfter tasks.getByPath(':FlatFiles-Persistence:build')

tasks {
    runServer {
        minecraftVersion("1.21.8")
    }
}